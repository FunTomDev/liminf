{% extends 'base.html' %} {% block content %}
<section class="hero-section relative overflow-hidden z-40">
	<div class="text-center relative z-10 max-w-screen-lg mx-auto">
		<h1 class="text-4xl sm:text-5xl md:text-7xl font-bold text-gray-300 mb-6">Materiały</h1>
		<p class="text-gray-400 max-w-2xl mx-auto text-lg">
			Lista wszystkich dostępnych źródeł do nauki: <em><strong>oficjalnych</strong></em> materiałów z zajęć i udostępnionych przez studentów notatek.
		</p>
	</div>
</section>
<hr class="divider" />
<section class="materials-section py-12 px-8 md:px-16">
	<div class="container flex gap-8">
		<div class="filters w-1/4">
			<h2 class="text-2xl font-bold text-gray-300 border-2 border-gray-400 p-4 rounded-full">Filtry</h2>
		</div>
		<div class="materials-list w-3/4 grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4 w-3/4">
			<h2 class="text-2xl font-bold text-gray-300 mb-4">Materiały</h2>
			{% for material in materials %}
			<div class="material-card"></div>
			{% endfor %}
		</div>
	</div>
</section>
{% endblock content %}
