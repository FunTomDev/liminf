{% extends 'base.html' %}


{% block content %}
<div class="h-screen grid place-items-center">
	<div class="w-80 flex flex-col gap-4">
		<h2 class="text-2xl font-bold text-gray-300 text-center">Logowanie</h2>
		<form action="{% url 'users:login' %}" class="main-form p-4 border border-gray-400 border-2 rounded-3xl" method="post">
			{% csrf_token %}
			<div class="flex flex-col gap-2">
				<label for="username">Login &#9432:</label>
				<input type="text" name="username" id="username">
			</div>
			<div class="flex flex-col gap-2">
				<div class="flex justify-between">
					<label for="password">Hasło:</label>
					<a class = "inline-link__sm" href="{% url 'users:reset-password' %}">Zresetuj hasło</a>
				</div>
				
				<input type="password" name="password" id="password">
			</div>
			<div class="flex flex-col items-center gap-1">
				<input class="w-full" type="submit" value="Zaloguj się">
				<a class = "inline-link__sm" href="{% url 'users:register' %}">Zarejestruj się</a>
			</div>
	  	</form>
	</div>
</div>
{% endblock %}
