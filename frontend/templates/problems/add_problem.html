{% extends 'base.html' %} {% load static %} {% block content %}
<div class="container min-w-full p-4 flex justify-center gap-8">
	<form class="form-primary [&_textarea]:rounded-4xl" action="{% url 'problems:add' %}" method="post" enctype="multipart/form-data">
		{% if form.non_field_errors %}
		<div>
			<div class="error">{{ form.non_field_errors}}</div>
		</div>
		{% endif %} {% csrf_token %}
		<div>
			<label for="{{ form.title.id_for_label }}">{{ form.title.label }}:</label>
			{{ form.title }}
		</div>
		<div>
			<label for="{{ form.description.id_for_label }}">{{ form.description.label }} <span class="text-gray-500">(opcjonalne)</span>:</label>
			{{ form.description }}
		</div>
		<div class="relative">
			<label for="{{ form.semester.id_for_label }}">{{ form.semester.label }}:</label>
			<div class="custom-select-wrapper relative" data-select-id="{{ form.semester.id_for_label }}">
				<!-- Hidden original select to maintain form submission -->
				<div class="opacity-0 absolute w-full min-h-full flex flex-row [&>select]:w-full" aria-hidden="true">{{ form.semester }}</div>

				<!-- Custom select UI -->
				<div class="custom-select min-w-[200px] relative">
					<button
						type="button"
						class="select-btn cursor-pointer w-full text-left flex items-center justify-between bg-blur border border-gray-400 hover:border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:border-gray-300"
						data-target="semester"
					>
						<span class="selected-text">Select a semester</span>
						<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-400" viewBox="0 0 20 20" fill="currentColor">
							<path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd" />
						</svg>
					</button>
					<div
						class="dropdown-menu absolute z-10 w-full mt-[42px] bg-blur border border-gray-300 rounded-md max-h-60 overflow-y-auto overflow-x-hidden hidden opacity-0 transform scale-95 transition-all duration-200 ease-in-out"
						data-dropdown="semester"
					>
						<ul class="py-1">
							<!-- Options will be populated by JavaScript -->
						</ul>
					</div>
				</div>
			</div>
		</div>
		<div class="relative">
			<label for="{{ form.topic.id_for_label }}">{{ form.topic.label }}:</label>
			<div class="custom-select-wrapper relative" data-select-id="{{ form.topic.id_for_label }}">
				<!-- Hidden original select to maintain form submission -->
				<div class="opacity-0 absolute w-full min-h-full flex flex-row [&>select]:w-full" aria-hidden="true">{{ form.topic }}</div>

				<!-- Custom select UI -->
				<div class="custom-select min-w-[200px] relative">
					<button
						type="button"
						class="select-btn cursor-pointer w-full text-left flex items-center justify-between bg-blur border border-gray-400 hover:border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:border-gray-300"
						data-target="topic"
					>
						<span class="selected-text">Select a topic</span>
						<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-400" viewBox="0 0 20 20" fill="currentColor">
							<path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd" />
						</svg>
					</button>
					<div
						class="dropdown-menu absolute z-10 w-full mt-[42px] bg-blur border border-gray-300 rounded-md max-h-60 overflow-y-auto overflow-x-hidden hidden opacity-0 transform scale-95 transition-all duration-200 ease-in-out"
						data-dropdown="topic"
					>
						<ul class="py-1">
							<!-- Options will be populated by JavaScript -->
							<a href="{% url 'curriculum:add_topic' %}?next={% url 'problems:add' %}"
								><li class="px-4 py-2 hover:bg-gray-900 cursor-pointer bg-blur flex flex-row items-center gap-2">
									<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
										<path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
									</svg>
									Dodaj nowy
								</li>
							</a>
						</ul>
					</div>
				</div>
			</div>
		</div>
		<div>
			<label for="{{ form.content.id_for_label }}">{{ form.content.label }} <span class="text-gray-500">(opcjonalne, jeśli dodano plik)</span>:</label>
			{{ form.content }}
		</div>
		<div>
			<label for="{{ form.file.id_for_label }}">{{ form.file.label }} <span class="text-gray-500">(opcjonalne, jeśli dodano treść)</span>:</label>
			{{ form.file }}
		</div>
		<button class="btn-primary">Dodaj</button>
	</form>
</div>

<script src="{% static 'js/custom-dropdown.js' %}"></script>

<style>
	/* Custom styles for animations and appearance */

	.dropdown-menu {
		max-height: 250px;
		scrollbar-width: thin;
		scrollbar-color: var(--color-gray-400) transparent;
		transform-origin: top;
		backface-visibility: hidden;
	}

	.dropdown-menu::-webkit-scrollbar {
		width: 6px;
	}

	.dropdown-menu::-webkit-scrollbar-track {
		background: #f7fafc;
	}

	.dropdown-menu::-webkit-scrollbar-thumb {
		background-color: #cbd5e0;
		border-radius: 3px;
	}

	.dropdown-menu ul li {
		transition: background-color 0.15s ease, transform 0.1s ease;
	}

	.dropdown-menu ul li:hover {
		background-color: color-mix(in oklab, var(--color-gray-900) /* oklch(87.2% 0.01 258.338) = #d1d5dc */ 40%, transparent);
		backdrop-filter: blur(8px);
		transform: translateX(4px);
		transition: transform 0.2s ease;
	}

	@keyframes pulse {
		0% {
			box-shadow: 0 0 0 0 rgba(66, 153, 225, 0.4);
		}
		70% {
			box-shadow: 0 0 0 5px rgba(66, 153, 225, 0);
		}
		100% {
			box-shadow: 0 0 0 0 rgba(66, 153, 225, 0);
		}
	}

	.select-btn:active {
		animation: pulse 0.3s;
	}
</style>
{% endblock %}
