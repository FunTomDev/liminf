{% extends 'base.html' %} {% block content %}

<section>
	<div class="title max-w-2xl mx-auto py-10">
		<h1 class="text-2xl font-bold text-center text-gray-300">{{ problem.title }}</h1>
		<p class="mt-2 text-gray-400 text-center">{{ problem.short_description }}</p>
	</div>
</section>
<hr class="divider" />
<section>
	{% if problem.content %}
	<div class="details max-w-2xl mx-auto">
		<h2 class="text-xl font-bold text-center text-gray-300">Treść</h2>
		<p class="mt-2 text-gray-400 text-center">{{ problem.content|safe }}</p>
	</div>
	{% endif %}
</section>
<hr class="divider" />
<section>
	{% if problem.file %}
	<div class="flex flex-col gap-4 max-w-2xl mx-auto">
		<h2 class="text-xl font-bold text-center text-gray-300">Pliki</h2>
		<div class="files grid grid-cols-[repeat(auto-fit,minmax(300px,1fr))] gap-4 place-items-center">
			<a href="{{ problem.file.url }}" target="_blank" class="p-4 border-2 border-gray-300 text-gray-300 rounded-full w-min hover:bg-gray-900 transition-all duration-300"> {{ file_name }} </a>
		</div>
	</div>
	{% endif %}
</section>

{% endblock content %}
