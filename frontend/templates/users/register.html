{% extends 'base_no_heafoo.html' %}

{% block content %}
<div class="h-screen grid place-items-center">
	<div class="w-80 flex flex-col gap-4">
		<h2 class="text-2xl font-bold text-gray-300 text-center">Rejestracja</h2>
		<form action="{% url 'users:register' %}" class="main-form p-4 border-gray-400 border-2 rounded-3xl" method="post">
			{% csrf_token %}
	  		<div>
	  			<label for="username">Login:</label>
				<input type="text" name="username" id="username">
	  		</div>
	  		<div>
	  			<label for="username">Imię:</label>
				<input type="text" name="username" id="username">
	  		</div>
	  		<div>
	  			<label for="username">Nazwisko:</label>
				<input type="text" name="username" id="username">
	  		</div>
	  		<div>
	  			<label for="email">E-mail:</label>
				<input type="email" name="email" id="email">
	  		</div>
			<div>
				<label for="password">Hasło:</label>
				<input type="password" name="password" id="password">
			</div>
			<div class="flex flex-col items-center gap-1">
				<input class="w-full" type="submit" value="Zarejestruj się">
				<p class="text-sm">Masz już konto? <a class = "inline-link__sm" href="{% url 'users:login' %}">Zaloguj się</a></p>
			</div>
		</form>
	</div>
</div>
{% endblock %}
