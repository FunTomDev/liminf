{% extends 'base_no_heafoo.html' %} {% block content %}
<div class="h-screen grid place-items-center">
	<div class="w-80 flex flex-col gap-4">
		<h2 class="text-2xl font-bold text-gray-300 text-center">Resetowanie hasła</h2>
		<form action="{% url 'users:reset-password' %}" class="main-form p-4 border-gray-400 border-2 rounded-3xl" method="post">
			{% csrf_token %}
			<div class="flex flex-col gap-2">
				<label for="email">E-mail:</label>
				<input type="email" name="email" id="email" required/>
			</div>
			<input type="submit" value="Resetuj hasło" />
		</form>
	</div>
</div>
{% endblock %}
